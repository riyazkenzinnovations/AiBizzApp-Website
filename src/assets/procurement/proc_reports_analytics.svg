    <text x="24" y="32" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Monthly Procurement Spend vs. Budget</text>
    <text x="24" y="52" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Comparison across Manufacturing, Stores &amp; Operations</text>
    
    <!-- Legend -->
