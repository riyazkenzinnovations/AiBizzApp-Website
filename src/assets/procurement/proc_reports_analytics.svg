<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="logoGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00a3ff"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad5)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(28, 14)">
    <path d="M4 32 L28 4 L28 32 Z" fill="url(#logoGrad5)"/>
    <circle cx="28" cy="10" r="4.5" fill="#38bdf8"/>
    <circle cx="34" cy="18" r="3.5" fill="#0284c7"/>
    <circle cx="32" cy="26" r="3" fill="#0ea5e9"/>
    <text x="44" y="24" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="156" y="24" font-family="Poppins, sans-serif" font-size="15" font-weight="500" fill="#64748b">| Procurement Analytics</text>
  </g>

  <!-- Title & Controls -->
  <g transform="translate(36, 92)">
    <text x="0" y="24" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Procurement Analytics &amp; Spend Intelligence</text>
    <text x="0" y="46" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">Track purchasing trends across item categories, analyze vendor performance, and control budgets in real-time.</text>
    
    <rect x="920" y="4" width="130" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="936" y="27" font-family="Poppins, sans-serif" font-size="13" fill="#334155">FY 2024 (YTD) &or;</text>
    <rect x="1066" y="4" width="142" height="36" rx="8" fill="#0066cc"/>
    <text x="1084" y="27" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Download Report</text>
  </g>

  <!-- Metric KPI Cards -->
  <g transform="translate(36, 156)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="280" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow5)"/>
    <text x="20" y="26" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">TOTAL PROCUREMENT SPEND</text>
    <text x="20" y="58" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">$1.84M</text>
    <rect x="190" y="16" width="70" height="22" rx="11" fill="#eff6ff"/>
    <text x="202" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">&minus;4.2% YoY</text>

    <!-- KPI 2 -->
    <rect x="310" y="0" width="280" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow5)"/>
    <text x="330" y="26" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">PURCHASE ORDERS ISSUED</text>
    <text x="330" y="58" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">426 POs</text>
    <rect x="500" y="16" width="70" height="22" rx="11" fill="#ecfdf5"/>
    <text x="512" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">98% In Time</text>

    <!-- KPI 3 -->
    <rect x="620" y="0" width="280" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow5)"/>
    <text x="640" y="26" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">COST SAVINGS ACHIEVED</text>
    <text x="640" y="58" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#10b981">$142,800</text>
    <rect x="800" y="16" width="80" height="22" rx="11" fill="#ecfdf5"/>
    <text x="814" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">Negotiations</text>

    <!-- KPI 4 -->
    <rect x="930" y="0" width="278" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow5)"/>
    <text x="950" y="26" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">ON-TIME IN FULL (OTIF)</text>
    <text x="950" y="58" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">96.4%</text>
    <rect x="1110" y="16" width="78" height="22" rx="11" fill="#eff6ff"/>
    <text x="1122" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">Grade A</text>
