    <text x="458" y="36" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Actual Spend</text>
    <rect x="560" y="26" width="12" height="12" rx="3" fill="#94a3b8"/>
    <text x="578" y="36" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Budget Limit</text>

