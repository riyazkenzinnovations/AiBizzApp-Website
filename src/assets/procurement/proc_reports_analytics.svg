      <line x1="40" y1="180" x2="620" y2="180" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="120" x2="620" y2="120" stroke="#f1f5f9" stroke-width="1"/>
      <line x1="40" y1="60" x2="620" y2="60" stroke="#f1f5f9" stroke-width="1"/>
      
      <text x="10" y="244" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">$0</text>
      <text x="6" y="184" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">$100k</text>
      <text x="6" y="124" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">$200k</text>
      <text x="6" y="64" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">$300k</text>

      <!-- Month 1: Jun -->
      <rect x="60" y="90" width="28" height="150" rx="4" fill="url(#barGrad1)"/>
      <rect x="92" y="70" width="16" height="170" rx="3" fill="#cbd5e1"/>
      <text x="70" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Jun</text>

      <!-- Month 2: Jul -->
      <rect x="150" y="70" width="28" height="170" rx="4" fill="url(#barGrad1)"/>
      <rect x="182" y="60" width="16" height="180" rx="3" fill="#cbd5e1"/>
      <text x="160" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Jul</text>

      <!-- Month 3: Aug -->
      <rect x="240" y="110" width="28" height="130" rx="4" fill="url(#barGrad1)"/>
      <rect x="272" y="80" width="16" height="160" rx="3" fill="#cbd5e1"/>
      <text x="250" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Aug</text>

      <!-- Month 4: Sep -->
      <rect x="330" y="50" width="28" height="190" rx="4" fill="url(#barGrad1)"/>
      <rect x="362" y="40" width="16" height="200" rx="3" fill="#cbd5e1"/>
      <text x="340" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Sep</text>

      <!-- Month 5: Oct -->
      <rect x="420" y="80" width="28" height="160" rx="4" fill="url(#barGrad1)"/>
      <rect x="452" y="60" width="16" height="180" rx="3" fill="#cbd5e1"/>
      <text x="430" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Oct</text>

      <!-- Month 6: Nov -->
      <rect x="510" y="100" width="28" height="140" rx="4" fill="url(#barGrad1)"/>
      <rect x="542" y="60" width="16" height="180" rx="3" fill="#cbd5e1"/>
      <text x="520" y="260" font-family="Poppins, sans-serif" font-size="11" fill="#475569">Nov</text>
    </g>

    <!-- Chart 2: Top Suppliers & Categories -->
    <rect x="710" y="0" width="498" height="400" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow5)"/>
    <text x="734" y="32" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Top Suppliers by Volume</text>
    <text x="734" y="52" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Performance score and fulfillment rate</text>

    <!-- Supplier 1 -->
    <g transform="translate(734, 80)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Apex Steels Ltd</text>
      <text x="320" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">$640,000</text>
      <rect y="26" width="380" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="26" width="310" height="8" rx="4" fill="#0066cc"/>
      <text x="400" y="34" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">99% OTIF</text>
    </g>

    <!-- Supplier 2 -->
    <g transform="translate(734, 144)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Titan Metal Corp</text>
      <text x="320" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">$480,000</text>
      <rect y="26" width="380" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="26" width="240" height="8" rx="4" fill="#38bdf8"/>
      <text x="400" y="34" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">97% OTIF</text>
    </g>

    <!-- Supplier 3 -->
    <g transform="translate(734, 208)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">OmniChip Inc</text>
      <text x="320" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">$320,000</text>
      <rect y="26" width="380" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="26" width="160" height="8" rx="4" fill="#60a5fa"/>
      <text x="400" y="34" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">95% OTIF</text>
    </g>

    <!-- Supplier 4 -->
    <g transform="translate(734, 272)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">LubriMax PetroSyn</text>
      <text x="320" y="16" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">$195,000</text>
      <rect y="26" width="380" height="8" rx="4" fill="#f1f5f9"/>
      <rect y="26" width="110" height="8" rx="4" fill="#93c5fd"/>
      <text x="400" y="34" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">98% OTIF</text>
    </g>
