<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00a3ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Logo & Title -->
  <g transform="translate(28, 14)">
    <!-- AiBizzApp Triangle Logo -->
    <path d="M4 32 L28 4 L28 32 Z" fill="url(#logoGrad)"/>
    <circle cx="28" cy="10" r="4.5" fill="#38bdf8"/>
    <circle cx="34" cy="18" r="3.5" fill="#0284c7"/>
    <circle cx="32" cy="26" r="3" fill="#0ea5e9"/>
    <text x="44" y="24" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="156" y="24" font-family="Poppins, sans-serif" font-size="15" font-weight="500" fill="#64748b">| Buying &amp; Procurement</text>
  </g>

  <!-- Navbar Search & User -->
  <rect x="740" y="14" width="280" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="760" y="37" font-family="Poppins, sans-serif" font-size="13" fill="#94a3b8">Search RFQs, vendors...</text>
  <circle cx="1180" cy="32" r="18" fill="#e2e8f0"/>
  <circle cx="1180" cy="28" r="7" fill="#94a3b8"/>
  <path d="M1168 44 C1168 37 1173 35 1180 35 C1187 35 1192 37 1192 44" fill="#94a3b8"/>
  <text x="1208" y="37" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#334155">Procurement Dept</text>

  <!-- Main Content Header -->
  <g transform="translate(36, 92)">
    <text x="0" y="24" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Request for Quotation (RFQ)</text>
    <text x="0" y="46" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">Broadcast requirements directly to preferred vendors and compare incoming responses.</text>
    
    <!-- Action button -->
    <rect x="1060" y="2" width="148" height="40" rx="8" fill="#0066cc"/>
    <text x="1092" y="27" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+ Create RFQ</text>
  </g>

  <!-- Summary Metric Cards -->
  <g transform="translate(36, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="20" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase">Active RFQs</text>
    <text x="20" y="60" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#0f172a">14</text>
    <rect x="190" y="22" width="70" height="24" rx="12" fill="#eff6ff"/>
    <text x="203" y="38" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">Live Portal</text>

    <!-- Card 2 -->
    <rect x="310" y="0" width="280" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="330" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase">Quotes Received</text>
    <text x="330" y="60" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#10b981">42</text>
    <rect x="500" y="22" width="70" height="24" rx="12" fill="#ecfdf5"/>
    <text x="512" y="38" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">+6 Today</text>

    <!-- Card 3 -->
    <rect x="620" y="0" width="280" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="640" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase">Pending Evaluation</text>
    <text x="640" y="60" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#f59e0b">8</text>
    <rect x="800" y="22" width="80" height="24" rx="12" fill="#fef3c7"/>
    <text x="812" y="38" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#d97706">Reviewing</text>

    <!-- Card 4 -->
    <rect x="930" y="0" width="278" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    <text x="950" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-transform="uppercase">Supplier Response Rate</text>
    <text x="950" y="60" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#0f172a">94.8%</text>
    <rect x="1120" y="22" width="70" height="24" rx="12" fill="#eff6ff"/>
    <text x="1132" y="38" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">Optimal</text>
  </g>

  <!-- Table Container -->
  <g transform="translate(36, 270)">
    <rect width="1208" height="410" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Table Header Bar -->
    <rect width="1208" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">RFQ NUMBER</text>
    <text x="160" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">CATEGORY / ITEM</text>
    <text x="430" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">INVITED SUPPLIERS</text>
    <text x="730" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">SUBMISSION DEADLINE</text>
    <text x="940" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">STATUS</text>
    <text x="1100" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">ACTIONS</text>

    <!-- Row 1 -->
    <line x1="0" y1="96" x2="1208" y2="96" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="76" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">RFQ-2024-0082</text>
    <text x="160" y="76" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Industrial Steel Sheets (3mm)</text>
    <text x="430" y="76" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">Apex Steels, Titan Metal, Allied Ltd</text>
    <text x="730" y="76" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">24 Nov 2024 (2 days left)</text>
    <rect x="940" y="60" width="112" height="24" rx="12" fill="#ecfdf5"/>
    <text x="955" y="76" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#10b981">3 Quotes Recv</text>
    <text x="1100" y="76" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">Compare &gt;</text>

    <!-- Row 2 -->
    <line x1="0" y1="146" x2="1208" y2="146" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="126" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">RFQ-2024-0081</text>
    <text x="160" y="126" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Microcontrollers &amp; PCBs</text>
    <text x="430" y="126" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">OmniChip Inc, Global Circuits</text>
    <text x="730" y="126" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">28 Nov 2024 (6 days left)</text>
    <rect x="940" y="110" width="112" height="24" rx="12" fill="#eff6ff"/>
    <text x="960" y="126" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">Broadcasted</text>
    <text x="1100" y="126" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">View &gt;</text>

    <!-- Row 3 -->
    <line x1="0" y1="196" x2="1208" y2="196" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="176" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">RFQ-2024-0080</text>
    <text x="160" y="176" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Heavy Hydraulic Fluids 200L</text>
    <text x="430" y="176" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">LubriMax Corp, PetroSyn</text>
    <text x="730" y="176" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">20 Nov 2024 (Closed)</text>
    <rect x="940" y="160" width="112" height="24" rx="12" fill="#fef3c7"/>
    <text x="955" y="176" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#d97706">Under Review</text>
    <text x="1100" y="176" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">Award PO &gt;</text>

    <!-- Row 4 -->
    <line x1="0" y1="246" x2="1208" y2="246" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="226" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">RFQ-2024-0079</text>
    <text x="160" y="226" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Corrugated Packaging Boxes</text>
    <text x="430" y="226" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">PackPro Ltd, EcoPack Solutions</text>
    <text x="730" y="226" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">15 Nov 2024 (Completed)</text>
    <rect x="940" y="210" width="112" height="24" rx="12" fill="#f1f5f9"/>
    <text x="965" y="226" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">PO Awarded</text>
    <text x="1100" y="226" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">Archived</text>

    <!-- Row 5 -->
    <line x1="0" y1="296" x2="1208" y2="296" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="276" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">RFQ-2024-0078</text>
    <text x="160" y="276" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">CNC Precision Tool Bits</text>
    <text x="430" y="276" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">PrecisionTech, MasterCraft Tools</text>
    <text x="730" y="276" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">12 Nov 2024 (Completed)</text>
    <rect x="940" y="260" width="112" height="24" rx="12" fill="#f1f5f9"/>
    <text x="965" y="276" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">PO Awarded</text>
    <text x="1100" y="276" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">Archived</text>
  </g>
</svg>
