<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00a3ff"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad2)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(28, 14)">
    <path d="M4 32 L28 4 L28 32 Z" fill="url(#logoGrad2)"/>
    <circle cx="28" cy="10" r="4.5" fill="#38bdf8"/>
    <circle cx="34" cy="18" r="3.5" fill="#0284c7"/>
    <circle cx="32" cy="26" r="3" fill="#0ea5e9"/>
    <text x="44" y="24" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="156" y="24" font-family="Poppins, sans-serif" font-size="15" font-weight="500" fill="#64748b">| Buying &amp; Procurement</text>
  </g>

  <!-- User & Actions -->
  <g transform="translate(1030, 16)">
    <rect width="100" height="32" rx="6" fill="#f1f5f9"/>
    <text x="18" y="21" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#475569">Export CSV</text>
    <rect x="114" y="0" width="100" height="32" rx="6" fill="#0066cc"/>
    <text x="128" y="21" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Create PO</text>
  </g>

  <!-- Page Title & RFQ Selector -->
  <g transform="translate(36, 92)">
    <text x="0" y="24" font-family="Poppins, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Supplier Quotation Comparison Matrix</text>
    <text x="0" y="46" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">Evaluating responses for RFQ #2024-0082 (Industrial Steel Sheets 3mm)</text>
    
    <rect x="940" y="4" width="268" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="956" y="27" font-family="Poppins, sans-serif" font-size="13" fill="#334155">Filter: Lowest Rate First</text>
  </g>

  <!-- Supplier Summary Cards -->
  <g transform="translate(36, 156)">
    <!-- Vendor 1: Apex Steels (Winner) -->
    <rect x="0" y="0" width="380" height="110" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="20" y="16" width="104" height="22" rx="11" fill="#ecfdf5"/>
    <text x="32" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#059669">&#9733; LOWEST BID</text>
    <text x="20" y="62" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Apex Steels Ltd</text>
    <text x="20" y="82" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Quote #SQ-8812 &bull; Valid till 30 Nov</text>
    <text x="260" y="62" font-family="Poppins, sans-serif" font-size="22" font-weight="800" fill="#059669">$14,200</text>
    <text x="260" y="82" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Lead: 5 Days</text>

    <!-- Vendor 2: Titan Metal Corp -->
    <rect x="414" y="0" width="380" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow2)"/>
    <rect x="434" y="16" width="104" height="22" rx="11" fill="#eff6ff"/>
    <text x="446" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#0066cc">QUALIFIED</text>
    <text x="434" y="62" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Titan Metal Corp</text>
    <text x="434" y="82" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Quote #SQ-8815 &bull; Valid till 28 Nov</text>
    <text x="674" y="62" font-family="Poppins, sans-serif" font-size="22" font-weight="800" fill="#0f172a">$15,450</text>
    <text x="674" y="82" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Lead: 7 Days</text>

    <!-- Vendor 3: Allied Industrial -->
    <rect x="828" y="0" width="380" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow2)"/>
    <rect x="848" y="16" width="104" height="22" rx="11" fill="#f1f5f9"/>
    <text x="860" y="31" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#64748b">STANDARD</text>
    <text x="848" y="62" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Allied Industrial</text>
    <text x="848" y="82" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Quote #SQ-8819 &bull; Valid till 25 Nov</text>
    <text x="1088" y="62" font-family="Poppins, sans-serif" font-size="22" font-weight="800" fill="#0f172a">$16,100</text>
    <text x="1088" y="82" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Lead: 10 Days</text>
  </g>

  <!-- Detailed Comparison Table -->
  <g transform="translate(36, 290)">
    <rect width="1208" height="390" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow2)"/>
    
    <!-- Table Header Bar -->
    <rect width="1208" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="24" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">ITEM &amp; SPECIFICATION</text>
    <text x="360" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">QTY</text>
    <text x="470" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">APEX STEELS (UNIT / TOTAL)</text>
    <text x="730" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">TITAN METAL (UNIT / TOTAL)</text>
    <text x="980" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569">ALLIED IND (UNIT / TOTAL)</text>

    <!-- Item Row 1 -->
    <line x1="0" y1="96" x2="1208" y2="96" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="74" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Raw Steel Plates 5mm (Grade A)</text>
    <text x="24" y="90" font-family="Poppins, sans-serif" font-size="11" fill="#94a3b8">SKU: STL-5MM-GRA</text>
    <text x="360" y="76" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">1,500 kg</text>
    <text x="470" y="76" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#059669">$5.80 / $8,700</text>
    <text x="730" y="76" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$6.20 / $9,300</text>
    <text x="980" y="76" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$6.50 / $9,750</text>

    <!-- Item Row 2 -->
    <line x1="0" y1="156" x2="1208" y2="156" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="134" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Cold Rolled Coil 2mm</text>
    <text x="24" y="150" font-family="Poppins, sans-serif" font-size="11" fill="#94a3b8">SKU: CRC-2MM-COIL</text>
    <text x="360" y="136" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">800 kg</text>
    <text x="470" y="136" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#059669">$6.875 / $5,500</text>
    <text x="730" y="136" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$7.68 / $6,150</text>
    <text x="980" y="136" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$7.93 / $6,350</text>

    <!-- Terms Row -->
    <line x1="0" y1="216" x2="1208" y2="216" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="196" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#475569">Payment Terms</text>
    <text x="360" y="196" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">-</text>
    <text x="470" y="196" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Net 30 Days</text>
    <text x="730" y="196" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">Net 15 Days</text>
    <text x="980" y="196" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">Advance 50%</text>

    <!-- Delivery Row -->
    <line x1="0" y1="276" x2="1208" y2="276" stroke="#f1f5f9" stroke-width="1"/>
    <text x="24" y="256" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#475569">Delivery Lead Time</text>
    <text x="360" y="256" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">-</text>
    <text x="470" y="256" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#059669">5 Business Days</text>
    <text x="730" y="256" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">7 Business Days</text>
    <text x="980" y="256" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">10 Business Days</text>

    <!-- Total Cost Summary Row -->
    <rect y="316" width="1208" height="74" rx="0" fill="#f8fafc"/>
    <text x="24" y="356" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0f172a">GRAND TOTAL (EXCL. TAX)</text>
    <text x="470" y="356" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#059669">$14,200.00</text>
    <text x="730" y="356" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#475569">$15,450.00</text>
    <text x="980" y="356" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#475569">$16,100.00</text>
  </g>
</svg>
