<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="logoGradC3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="shadowC3" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGradC3)"/>

  <!-- Top App Navbar -->
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 12)">
    <circle cx="18" cy="18" r="18" fill="url(#logoGradC3)"/>
    <text x="18" y="23" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Ai</text>
    <text x="44" y="23" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="142" y="23" font-family="Poppins, sans-serif" font-size="16" font-weight="500" fill="#334155">Omnichannel CRM</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(680, 12)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <line x1="24" y1="22" x2="30" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="38" y="23" font-family="Poppins, sans-serif" font-size="12" fill="#94a3b8">Search conversations or phone numbers</text>
  </g>

  <!-- Top Right Controls -->
  <g transform="translate(1060, 14)">
    <circle cx="40" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M37 12 C37 10 43 10 43 12 L45 18 L35 18 Z" fill="#64748b"/>
    <circle cx="44" cy="9" r="3.5" fill="#ef4444"/>
    <circle cx="80" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="80" cy="16" r="4" stroke="#64748b" stroke-width="2" fill="none"/>
    <circle cx="120" cy="16" r="15" fill="#e2e8f0"/>
    <text x="120" y="21" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">NP</text>
  </g>

  <!-- Secondary Navigation Sub-bar -->
  <rect x="0" y="60" width="1280" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 86)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Pipeline</text>
    <text x="80" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Leads</text>
    <text x="140" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">WhatsApp Inbox</text>
    <line x1="138" y1="14" x2="256" y2="14" stroke="#0066cc" stroke-width="2"/>
    <text x="280" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Email Campaigns</text>
    <text x="410" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Templates</text>
  </g>

  <!-- Header -->
  <g transform="translate(32, 122)">
    <text x="0" y="16" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">CRM &gt; Omnichannel &gt; <tspan fill="#0066cc">WhatsApp Business Cloud API</tspan></text>
    <text x="0" y="44" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Integrated WhatsApp Sales &amp; Deal Messenger</text>
    <rect x="490" y="26" width="130" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="502" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">• API Connected (Live)</text>
  </g>

  <!-- Messenger Tri-Pane Container -->
  <g transform="translate(32, 180)">
    
    <!-- Pane 1: Conversations List (Left) -->
    <rect x="0" y="0" width="340" height="510" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadowC3)"/>
    
    <g transform="translate(20, 20)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">WhatsApp Chats</text>
      <text x="0" y="34" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Active deal conversations</text>
    </g>

    <!-- Chat Item 1 (Selected) -->
    <g transform="translate(12, 68)">
      <rect x="0" y="0" width="316" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="28" cy="37" r="18" fill="#25D366"/>
      <text x="28" y="42" font-family="Poppins, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">NP</text>
      <text x="56" y="28" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Nilay Patel (Vulcan Group)</text>
      <text x="56" y="46" font-family="Poppins, sans-serif" font-size="11" fill="#475569">"Could you send the updated quote?"</text>
      <text x="270" y="26" font-family="Poppins, sans-serif" font-size="10" fill="#0066cc">10:42 AM</text>
      <circle cx="296" cy="46" r="8" fill="#0066cc"/>
      <text x="296" y="50" font-family="Poppins, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    </g>

    <!-- Chat Item 2 -->
    <g transform="translate(12, 150)">
      <rect x="0" y="0" width="316" height="74" rx="8" fill="#ffffff" stroke="#f1f5f9"/>
      <circle cx="28" cy="37" r="18" fill="#e2e8f0"/>
      <text x="28" y="42" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">AB</text>
      <text x="56" y="28" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Aniket Bapat (Chandorkar)</text>
      <text x="56" y="46" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">"Thank you! Demo was great."</text>
      <text x="270" y="26" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">Yesterday</text>
    </g>

    <!-- Chat Item 3 -->
    <g transform="translate(12, 232)">
      <rect x="0" y="0" width="316" height="74" rx="8" fill="#ffffff" stroke="#f1f5f9"/>
      <circle cx="28" cy="37" r="18" fill="#e2e8f0"/>
      <text x="28" y="42" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">JV</text>
      <text x="56" y="28" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Jonathan Vance (Apex Tech)</text>
      <text x="56" y="46" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">"PO is getting signed today."</text>
      <text x="270" y="26" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">16 Sep</text>
    </g>

    <!-- Pane 2: Active Chat Area (Center) -->
    <g transform="translate(356, 0)">
      <rect x="0" y="0" width="510" height="510" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadowC3)"/>
      
      <!-- Chat Header -->
      <rect x="0" y="0" width="510" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="32" cy="28" r="16" fill="#25D366"/>
      <text x="32" y="33" font-family="Poppins, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">NP</text>
      <text x="58" y="26" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Nilay Patel</text>
      <text x="58" y="42" font-family="Poppins, sans-serif" font-size="11" fill="#059669">• WhatsApp Business Online</text>

      <!-- Message Bubbles -->
      <!-- Inbound 1 -->
      <g transform="translate(24, 80)">
        <rect x="0" y="0" width="340" height="52" rx="10" fill="#f1f5f9"/>
        <text x="14" y="24" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">Hi Sarah! We reviewed the initial ERP proposal.</text>
        <text x="14" y="42" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">10:38 AM</text>
      </g>

      <!-- Inbound 2 -->
      <g transform="translate(24, 144)">
        <rect x="0" y="0" width="370" height="56" rx="10" fill="#f1f5f9"/>
        <text x="14" y="22" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">Could you adjust for 50 licenses and send the</text>
        <text x="14" y="38" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">updated commercial quotation?</text>
        <text x="14" y="52" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">10:39 AM</text>
      </g>

      <!-- Outbound 1 -->
      <g transform="translate(100, 216)">
        <rect x="0" y="0" width="386" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="14" y="22" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">Hi Nilay! Absolutely. Generated QTN-2025-019</text>
        <text x="14" y="38" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">with the 10% volume tier discount applied.</text>
        <text x="14" y="58" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">📄 Quotation-QTN-019.pdf (142 KB)</text>
        <text x="330" y="60" font-family="Poppins, sans-serif" font-size="10" fill="#0066cc">10:41 AM ✓✓</text>
      </g>

      <!-- Inbound 3 -->
      <g transform="translate(24, 300)">
        <rect x="0" y="0" width="310" height="50" rx="10" fill="#f1f5f9"/>
        <text x="14" y="24" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">Perfect, looking at it now. Thank you!</text>
        <text x="14" y="42" font-family="Poppins, sans-serif" font-size="10" fill="#94a3b8">10:42 AM</text>
      </g>

      <!-- Chat Input Box -->
      <g transform="translate(20, 440)">
        <rect x="0" y="0" width="470" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="16" y="28" font-family="Poppins, sans-serif" font-size="12" fill="#94a3b8">Type a message or insert CRM template...</text>
        <rect x="380" y="8" width="76" height="30" rx="6" fill="#25D366"/>
        <text x="398" y="28" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Send</text>
      </g>
    </g>

    <!-- Pane 3: Linked CRM Deal Record (Right) -->
    <g transform="translate(882, 0)">
      <rect x="0" y="0" width="334" height="510" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadowC3)"/>
      
      <g transform="translate(20, 20)">
        <text x="0" y="16" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Linked CRM Deal Context</text>
        <text x="0" y="34" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Real-time pipeline sync</text>
      </g>

      <!-- Deal Card -->
      <g transform="translate(16, 68)">
        <rect x="0" y="0" width="302" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="14" y="24" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Vulcan Enterprise Expansion</text>
        <text x="14" y="44" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Stage: Proposal Sent</text>
        <text x="14" y="74" font-family="Poppins, sans-serif" font-size="20" font-weight="800" fill="#0066cc">$85,000</text>
        <rect x="14" y="92" width="100" height="20" rx="10" fill="#ecfdf5"/>
        <text x="24" y="106" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669">Prob: 75% Won</text>
        <text x="14" y="132" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Owner: Sarah Jenkins</text>
      </g>

      <!-- Quick Actions -->
      <g transform="translate(16, 236)">
        <text x="0" y="16" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#475569">QUICK TEMPLATES</text>
        
        <rect x="0" y="28" width="302" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="50" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">⚡ Send Meeting Calendar Link</text>

        <rect x="0" y="70" width="302" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="92" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">⚡ Send Latest Price Sheet</text>

        <rect x="0" y="112" width="302" height="34" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="12" y="134" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">⚡ Convert to Sales Order</text>
      </g>
    </g>
  </g>
</svg>
