<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="logoGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow7" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad7)"/>

  <!-- Top App Navbar -->
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 12)">
    <circle cx="18" cy="18" r="18" fill="url(#logoGrad7)"/>
    <text x="18" y="23" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Ai</text>
    <text x="44" y="23" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="142" y="23" font-family="Poppins, sans-serif" font-size="16" font-weight="500" fill="#334155">Stock</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(680, 12)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <line x1="24" y1="22" x2="30" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="38" y="23" font-family="Poppins, sans-serif" font-size="12" fill="#94a3b8">Search batch numbers, serials, warranties... (Ctrl + K)</text>
  </g>

  <!-- Top Right Controls -->
  <g transform="translate(1060, 14)">
    <circle cx="40" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="80" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="80" cy="16" r="4" stroke="#64748b" stroke-width="2" fill="none"/>
    <circle cx="120" cy="16" r="15" fill="#e2e8f0"/>
    <text x="120" y="21" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">SJ</text>
  </g>

  <!-- Secondary Navigation Sub-bar -->
  <rect x="0" y="60" width="1280" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 86)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Dashboard</text>
    <text x="100" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Item Master</text>
    <text x="210" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Warehouses</text>
    <text x="320" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Replenishment</text>
    <text x="440" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Reconciliation</text>
    <text x="560" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">Serial &amp; Batched</text>
    <line x1="558" y1="14" x2="688" y2="14" stroke="#0066cc" stroke-width="2"/>
  </g>

  <!-- Breadcrumb & Header Title -->
  <g transform="translate(32, 122)">
    <text x="0" y="16" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Stock &gt; Traceability &gt; <tspan fill="#0066cc">Serial &amp; Batch Master</tspan></text>
    <text x="0" y="44" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Serialised &amp; Batched Inventory with FEFO Expiry Tracking</text>
    
    <rect x="610" y="26" width="138" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="624" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">• 100% Traceability</text>

    <rect x="758" y="26" width="132" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="772" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">• FEFO Enforced</text>

    <rect x="1080" y="20" width="136" height="32" rx="6" fill="#0066cc"/>
    <text x="1106" y="41" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Create Batch</text>
  </g>

  <!-- Top KPI Metrics Banner -->
  <g transform="translate(32, 178)">
    <rect x="0" y="0" width="1216" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow7)"/>
    <g transform="translate(28, 20)">
      <text x="0" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">ACTIVE SERIALIZED UNITS</text>
      <text x="0" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">14,820 Units</text>
      <text x="0" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">● Individual Warranty Records</text>

      <text x="320" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">MANAGED PRODUCT BATCHES</text>
      <text x="320" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#0066cc">428 Active Batches</text>
      <text x="320" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">Automated First-Expiry-First-Out</text>

      <text x="620" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">EXPIRED DISPATCH PREVENTION</text>
      <text x="620" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#059669">0 Incidents (100% Lock)</text>
      <text x="620" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">System Enforced Hard Block</text>

      <text x="940" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">WARRANTY AUDIT LOOKUP</text>
      <text x="940" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Instant Search</text>
      <text x="940" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">By Serial, IMEI, or Barcode</text>
    </g>
  </g>

  <!-- Main Content Layout (Split Cards) -->
  <g transform="translate(32, 286)">
    <!-- Left Card: Batch & Serial Table -->
    <rect x="0" y="0" width="770" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow7)"/>
    <g transform="translate(24, 20)">
      <text x="0" y="14" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Active Batches &amp; Serial Unit Registry</text>
      <text x="0" y="32" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Meticulous lifecycle tracking from vendor purchase to customer warranty expiry</text>

      <!-- Table Header -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="722" height="32" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
        <text x="16" y="21" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">BATCH / SERIAL ID</text>
        <text x="200" y="21" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">ITEM CODE</text>
        <text x="360" y="21" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">MFG DATE</text>
        <text x="460" y="21" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">EXPIRY / WARRANTY</text>
        <text x="610" y="21" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS</text>

        <!-- Row 1 (Batch) -->
        <g transform="translate(0, 36)">
          <rect x="0" y="0" width="722" height="52" fill="#ffffff" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">BAT-2025-CH-09</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Batch Lot (850 Units)</text>
          <text x="200" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Lithium Cell Pack 48V</text>
          <text x="360" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">12 Jan 2025</text>
          <text x="460" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#059669">12 Jan 2027 (480d)</text>
          <rect x="610" y="16" width="98" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="659" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">FEFO Active</text>
        </g>

        <!-- Row 2 (Batch Alert) -->
        <g transform="translate(0, 92)">
          <rect x="0" y="0" width="722" height="52" fill="#fcfdfe" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#ea580c">BAT-2024-CH-44</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Batch Lot (120 Units)</text>
          <text x="200" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Thermal Gel Compound</text>
          <text x="360" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">05 Aug 2024</text>
          <text x="460" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#ea580c">05 Oct 2025 (17d)</text>
          <rect x="610" y="16" width="98" height="22" rx="11" fill="#fefce8" stroke="#fef08a"/>
          <text x="659" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#ca8a04" text-anchor="middle">Priority Dispatch</text>
        </g>

        <!-- Row 3 (Serial Unit) -->
        <g transform="translate(0, 148)">
          <rect x="0" y="0" width="722" height="52" fill="#ffffff" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SN-SRV-99201</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Customer: Vulcan Group</text>
          <text x="200" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">DC Servo Motor 2.4kW</text>
          <text x="360" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">02 Feb 2025</text>
          <text x="460" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">36 Mo (Exp: 2028)</text>
          <rect x="610" y="16" width="98" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="659" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#0066cc" text-anchor="middle">Dispatched</text>
        </g>

        <!-- Row 4 (Serial Unit In Stock) -->
        <g transform="translate(0, 204)">
          <rect x="0" y="0" width="722" height="52" fill="#fcfdfe" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SN-SRV-99202</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">WH-01 Central Depot</text>
          <text x="200" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">DC Servo Motor 2.4kW</text>
          <text x="360" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">02 Feb 2025</text>
          <text x="460" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">36 Mo (Unused)</text>
          <rect x="610" y="16" width="98" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="659" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">QC Passed ✓</text>
        </g>
      </g>

      <!-- Bottom Status Note -->
      <g transform="translate(0, 316)">
        <rect x="0" y="0" width="722" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="16" y="27" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">FEFO ENFORCEMENT: <tspan font-weight="400" fill="#334155">AiBizzApp auto-selects the nearest expiry batch during delivery note submission.</tspan></text>
      </g>
    </g>

    <!-- Right Card: Traceability & Compliance -->
    <g transform="translate(794, 0)">
      <rect x="0" y="0" width="422" height="404" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow7)"/>
      <g transform="translate(20, 20)">
        <text x="0" y="14" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Regulatory Traceability</text>
        <text x="0" y="32" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Full 360° forward &amp; reverse genealogy</text>

        <!-- Compliance Box 1: Forward Trace -->
        <g transform="translate(0, 50)">
          <rect x="0" y="0" width="382" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Forward Trace (Recall Shield)</text>
          <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Instantly find all customers who received units from any defective raw material lot.</text>
        </g>

        <!-- Compliance Box 2: Reverse Trace -->
        <g transform="translate(0, 136)">
          <rect x="0" y="0" width="382" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Reverse Trace (Vendor Audit)</text>
          <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Trace any customer warranty claim back to supplier Purchase Order &amp; Heat No.</text>
        </g>

        <!-- Compliance Box 3: Automated Expiry Lock -->
        <g transform="translate(0, 222)">
          <rect x="0" y="0" width="382" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">Automated Expiry Lockout</text>
          <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#334155">Expired batches are locked; cannot be added to Pick Lists or Delivery Notes.</text>
        </g>

        <!-- Bottom Pill -->
        <g transform="translate(0, 310)">
          <rect x="0" y="0" width="382" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="30" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">✓ 100% REGULATORY AUDIT COMPLIANCE</text>
        </g>
      </g>
    </g>
  </g>
</svg>
