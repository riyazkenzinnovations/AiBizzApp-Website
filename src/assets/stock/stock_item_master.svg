        <rect x="246" y="18" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="258" y="40" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Nos (Units)</text>

        <text x="246" y="74" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">BARCODE (EAN-13)</text>
        <rect x="246" y="80" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="258" y="102" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">8901030491023</text>

        <text x="246" y="136" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">SAFETY STOCK THRESHOLD</text>
        <rect x="246" y="142" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="258" y="164" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">50 Nos (Auto-Trigger MR)</text>

        <!-- Col 3 -->
        <text x="492" y="12" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">VALUATION METHOD</text>
