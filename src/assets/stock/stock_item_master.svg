    <text x="0" y="44" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">High-Precision Brushless DC Servo Motor (2.4kW)</text>
    
    <rect x="525" y="26" width="112" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="539" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">• Stockable Item</text>

    <rect x="645" y="26" width="124" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="659" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">• Auto-Reorder ON</text>

    <rect x="1090" y="20" width="126" height="32" rx="6" fill="#0066cc"/>
    <text x="1112" y="41" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Save &amp; Submit</text>
