        <text x="504" y="102" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">8501.31.00</text>

        <text x="492" y="136" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">TRACEABILITY RULES</text>
        <rect x="492" y="142" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="504" y="164" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#059669">Serialised + Batched (FEFO)</text>
      </g>

      <!-- Bottom Compliance Banner inside Left Card -->
      <g transform="translate(0, 304)">
        <rect x="0" y="0" width="712" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
        <text x="16" y="24" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#0066cc">CENTRALIZED SINGLE SOURCE OF TRUTH</text>
        <text x="16" y="44" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Eliminate duplicate items with automated naming conventions, unified barcodes, and cross-warehouse valuation.</text>
