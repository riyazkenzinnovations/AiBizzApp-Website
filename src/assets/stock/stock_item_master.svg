        <!-- Stock Velocity Card -->
        <g transform="translate(0, 270)">
          <rect x="0" y="0" width="392" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">ITEM VELOCITY &amp; TURNOVER</text>
          <text x="16" y="50" font-family="Poppins, sans-serif" font-size="20" font-weight="800" fill="#0066cc">8.4x / year</text>
          <rect x="280" y="16" width="96" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="328" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">FAST MOVING</text>
          <text x="16" y="74" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Monthly Outward Dispatches: 1,480 Units</text>
        </g>
