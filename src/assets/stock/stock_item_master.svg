      <rect x="4" y="48" width="130" height="26" rx="4" fill="#0066cc"/>
      <text x="69" y="65" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Item Details &amp; UOM</text>
      <text x="210" y="65" font-family="Poppins, sans-serif" font-size="11" font-weight="500" fill="#64748b">Warehouse Defaults</text>
