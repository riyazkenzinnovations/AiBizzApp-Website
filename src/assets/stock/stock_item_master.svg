      <text x="0" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">● Optimal Level Across 2 Hubs</text>

      <text x="320" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">RESERVED FOR ORDERS</text>
      <text x="320" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#ea580c">84 Nos</text>
      <text x="320" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Locked to SO-2025-00188</text>

      <text x="620" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">AVAILABLE TO PROMISE (ATP)</text>
      <text x="620" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#0066cc">240 Nos</text>
      <text x="620" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">Unrestricted Sales Pool</text>

      <text x="940" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">VALUATION (FIFO METHOD)</text>
      <text x="940" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#0f172a">$145,800.00</text>
      <text x="940" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Avg Rate: $450.00 / Unit</text>
    </g>
