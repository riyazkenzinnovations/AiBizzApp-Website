          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">WH-01 Central Depot</text>
          <rect x="290" y="10" width="88" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="334" y="24" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Rack B-14</text>

          <text x="16" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">On-Hand: <tspan font-weight="700" fill="#0f172a">180 Nos</tspan></text>
          <text x="140" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Reserved: <tspan font-weight="700" fill="#ea580c">60 Nos</tspan></text>
          <text x="260" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Available: <tspan font-weight="700" fill="#0066cc">120 Nos</tspan></text>

          <text x="16" y="78" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">Valuation: $81,000.00</text>
          <text x="280" y="78" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Avg Cost: $450/u</text>
        </g>

        <!-- Warehouse 2 -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="392" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">WH-02 West Logistics Hub</text>
          <rect x="290" y="10" width="88" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="334" y="24" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#0066cc" text-anchor="middle">Rack A-08</text>

          <text x="16" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">On-Hand: <tspan font-weight="700" fill="#0f172a">144 Nos</tspan></text>
          <text x="140" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Reserved: <tspan font-weight="700" fill="#ea580c">24 Nos</tspan></text>
          <text x="260" y="52" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Available: <tspan font-weight="700" fill="#0066cc">120 Nos</tspan></text>

          <text x="16" y="78" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">Valuation: $64,800.00</text>
          <text x="280" y="78" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Avg Cost: $450/u</text>
