        <text x="0" y="74" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">ITEM GROUP (CATEGORY)</text>
        <rect x="0" y="80" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="102" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Industrial Motors (Finished)</text>

        <text x="0" y="136" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">DEFAULT WAREHOUSE</text>
        <rect x="0" y="142" width="220" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="12" y="164" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#0f172a">Finished Goods - WH-01</text>

