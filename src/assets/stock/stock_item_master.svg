        <text x="504" y="40" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">FIFO (First In First Out)</text>

        <text x="492" y="74" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">HSN / SAC CODE</text>
