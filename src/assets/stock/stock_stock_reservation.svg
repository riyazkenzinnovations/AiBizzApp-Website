        <text x="16" y="27" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">CONFLICT PREVENTION LOCK: <tspan font-weight="400" fill="#334155">Reserved units are quarantined and blocked from unauthorized counter sales or transfers.</tspan></text>
