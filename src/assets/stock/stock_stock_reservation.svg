      <text x="0" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">● Locked to Verified Sales Orders</text>

      <text x="320" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">UNALLOCATED AVAILABLE (ATP)</text>
      <text x="320" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#0066cc">4,890 Units</text>
      <text x="320" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Open for New Quotes &amp; Orders</text>

      <text x="620" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">LINKED SALES ORDERS PROTECTED</text>
      <text x="620" y="38" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">38 Orders</text>
      <text x="620" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#059669">Zero Double-Allocation</text>

      <text x="940" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">DISPATCH SLA ADHERENCE</text>
