          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">SO-2025-00244</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Apex Industrial Corp</text>
          <text x="230" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Solar Sensor Hub</text>
          <text x="380" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">220 Nos</text>
          <text x="470" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">220 Nos (100%)</text>
          <text x="560" y="30" font-family="Poppins, sans-serif" font-size="11" fill="#334155">WH-02 West</text>
          <rect x="650" y="16" width="64" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="682" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Ready</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 148)">
          <rect x="0" y="0" width="722" height="52" fill="#ffffff" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">SO-2025-00392</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Nordic Energy Oy</text>
          <text x="230" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Lithium Cell Pack 48V</text>
          <text x="380" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">325 Nos</text>
          <text x="470" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#ea580c">200 Nos (62%)</text>
          <text x="560" y="30" font-family="Poppins, sans-serif" font-size="11" fill="#334155">WH-01 Depot</text>
          <rect x="650" y="16" width="64" height="22" rx="11" fill="#fefce8" stroke="#fef08a"/>
          <text x="682" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#ca8a04" text-anchor="middle">Partial</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 204)">
          <rect x="0" y="0" width="722" height="52" fill="#fcfdfe" stroke="#f1f5f9"/>
          <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">SO-2025-00411</text>
          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Vanguard Robotics</text>
          <text x="230" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">DC Servo Motor 2.4kW</text>
          <text x="380" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">84 Nos</text>
          <text x="470" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">84 Nos (100%)</text>
          <text x="560" y="30" font-family="Poppins, sans-serif" font-size="11" fill="#334155">WH-01 Depot</text>
          <rect x="650" y="16" width="64" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe"/>
          <text x="682" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#0066cc" text-anchor="middle">Allocated</text>
