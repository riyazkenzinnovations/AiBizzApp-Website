          <text x="16" y="38" font-family="Poppins, sans-serif" font-size="10" fill="#64748b">Nova Global Logistics</text>
          <text x="230" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#334155">Industrial Gateway I-90</text>
          <text x="380" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">150 Nos</text>
          <text x="470" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#059669">150 Nos (100%)</text>
          <text x="560" y="30" font-family="Poppins, sans-serif" font-size="11" fill="#334155">WH-01 Depot</text>
          <rect x="650" y="16" width="64" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
          <text x="682" y="31" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Ready</text>
