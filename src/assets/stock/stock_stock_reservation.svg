          <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Free Available Inventory (ATP)</text>
          <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Unreserved stock open for instantaneous fulfillment</text>
          <text x="290" y="34" font-family="Poppins, sans-serif" font-size="14" font-weight="800" fill="#0066cc">4,890 Units</text>

          <!-- Pool 2: Reserved Pool -->
