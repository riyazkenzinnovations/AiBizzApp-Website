            <rect x="0" y="0" width="382" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
            <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">2. Reserved for Confirmed Orders</text>
            <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#334155">Hard-locked to specific Sales Order references</text>
            <text x="290" y="34" font-family="Poppins, sans-serif" font-size="14" font-weight="800" fill="#ea580c">1,420 Units</text>
          </g>

          <!-- Pool 3: In Production / Transit -->
          <g transform="translate(0, 172)">
            <rect x="0" y="0" width="382" height="74" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
            <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">3. Reserved Against PO / MO</text>
            <text x="16" y="44" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Pre-allocated before arrival at loading dock</text>
            <text x="290" y="34" font-family="Poppins, sans-serif" font-size="14" font-weight="800" fill="#059669">725 Units</text>
          </g>
        </g>

