    <rect x="540" y="26" width="128" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="554" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">• 100% Conflict Free</text>

    <rect x="678" y="26" width="134" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="692" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">• MTO Priority Lock</text>

    <rect x="1080" y="20" width="136" height="32" rx="6" fill="#0066cc"/>
    <text x="1098" y="41" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#ffffff">+ Reserve Stock</text>
