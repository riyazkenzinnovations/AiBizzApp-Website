      <text x="50" y="40" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">SKU: LIC-ENT-01 • Multi-tenant unlimited user subscription</text>
      <text x="540" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">1 Year</text>
      <text x="660" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$8,200.00</text>
      <text x="800" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#059669">10.0%</text>
      <text x="930" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#475569">8% GST</text>
      <text x="1070" y="30" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$7,380.00</text>
    </g>

    <!-- Line Item 3 -->
    <g transform="translate(20, 240)">
      <line x1="0" y1="52" x2="1176" y2="52" stroke="#f1f5f9"/>
      <text x="16" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">3</text>
      <text x="50" y="22" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Deployment &amp; Customization Service</text>
      <text x="50" y="40" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">SKU: SRV-IMPL • 80 hours dedicated configuration engineer</text>
      <text x="540" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">80 Hrs</text>
      <text x="660" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$65.00</text>
      <text x="800" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#64748b">0.0%</text>
      <text x="930" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#475569">8% GST</text>
      <text x="1070" y="30" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$5,200.00</text>
