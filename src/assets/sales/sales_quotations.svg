    <!-- Grand Total Box -->
    <g transform="translate(800, 310)">
      <rect x="0" y="0" width="396" height="160" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="20" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Subtotal</text>
      <text x="320" y="30" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">$35,855.00</text>

      <text x="20" y="60" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Total Discount</text>
      <text x="320" y="60" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#059669">- $2,045.00</text>

      <text x="20" y="90" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">GST (8%)</text>
      <text x="320" y="90" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0f172a">$2,704.80</text>

      <line x1="16" y1="110" x2="380" y2="110" stroke="#cbd5e1"/>

      <text x="20" y="140" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0066cc">Grand Total</text>
      <text x="280" y="140" font-family="Poppins, sans-serif" font-size="17" font-weight="800" fill="#0066cc">$36,514.80</text>
    </g>

    <!-- Notes & Action Footer -->
    <g transform="translate(30, 330)">
      <text x="0" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">TERMS &amp; REMARKS</text>
      <text x="0" y="36" font-family="Poppins, sans-serif" font-size="12" fill="#475569">1. Delivery turnaround within 14 business days from PO signoff.</text>
      <text x="0" y="58" font-family="Poppins, sans-serif" font-size="12" fill="#475569">2. 2 Years manufacturer replacement warranty on X400 hardware.</text>
      <text x="0" y="80" font-family="Poppins, sans-serif" font-size="12" fill="#0066cc">✓ Click to convert to Sales Order upon customer acceptance</text>
