    <text x="100" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">Quotations</text>
    <line x1="98" y1="14" x2="180" y2="14" stroke="#0066cc" stroke-width="2"/>
