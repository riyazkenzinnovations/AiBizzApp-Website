    <text x="0" y="16" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Selling &gt; Quotation &gt; <tspan fill="#0066cc">SAL-QTN-2025-00142</tspan></text>
    <text x="0" y="44" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Commercial Quotation</text>
    <rect x="250" y="26" width="76" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="264" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#059669">Approved</text>
    
    <rect x="990" y="20" width="100" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1006" y="41" font-family="Poppins, sans-serif" font-size="12" font-weight="500" fill="#475569">Print PDF</text>
    <rect x="1102" y="20" width="114" height="32" rx="6" fill="#0066cc"/>
