    <line x1="24" y1="22" x2="30" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="38" y="23" font-family="Poppins, sans-serif" font-size="12" fill="#94a3b8">Search or type a command (Ctrl + K)</text>
