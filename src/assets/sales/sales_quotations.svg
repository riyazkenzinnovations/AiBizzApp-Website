    <text x="820" y="120" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">DISCOUNT</text>
    <text x="950" y="120" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">TAX</text>
    <text x="1090" y="120" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">AMOUNT</text>

