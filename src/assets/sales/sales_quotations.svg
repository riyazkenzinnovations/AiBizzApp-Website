      <text x="660" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">$2,450.00</text>
      <text x="800" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#059669">5.0%</text>
      <text x="930" y="30" font-family="Poppins, sans-serif" font-size="13" fill="#475569">8% GST</text>
      <text x="1070" y="30" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0f172a">$23,275.00</text>
