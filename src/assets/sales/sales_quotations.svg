      <text x="0" y="56" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Attn: Jonathan Vance • procurement@apextech.com</text>

      <text x="380" y="14" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">DATE &amp; VALIDITY</text>
