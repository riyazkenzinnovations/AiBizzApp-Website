    <g transform="translate(20, 106)">
      <line x1="0" y1="52" x2="740" y2="52" stroke="#f1f5f9"/>
      <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Precision Robotic Arm - Model A1</text>
      <text x="16" y="38" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">WH: Finished Goods (Bay 4) • Batch #BT-8841</text>
      <text x="314" y="28" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">25 Nos</text>
      <text x="424" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#059669">25 Nos</text>
      <text x="534" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">25 Nos</text>
      <rect x="644" y="16" width="76" height="20" rx="10" fill="#ecfdf5"/>
      <text x="656" y="30" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669">Dispatched</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(20, 158)">
      <line x1="0" y1="52" x2="740" y2="52" stroke="#f1f5f9"/>
      <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Optical Sensor Module 4K HDR</text>
      <text x="16" y="38" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">WH: Central Depot • Auto-reserved from stock</text>
      <text x="314" y="28" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">50 Nos</text>
      <text x="424" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#059669">50 Nos</text>
      <text x="534" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">50 Nos</text>
      <rect x="644" y="16" width="76" height="20" rx="10" fill="#ecfdf5"/>
      <text x="656" y="30" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669">Dispatched</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(20, 210)">
      <line x1="0" y1="52" x2="740" y2="52" stroke="#f1f5f9"/>
      <text x="16" y="22" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Firmware Calibration Toolkit</text>
      <text x="16" y="38" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Digital Download License Token Key</text>
      <text x="314" y="28" font-family="Poppins, sans-serif" font-size="12" fill="#0f172a">10 Nos</text>
      <text x="424" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#059669">10 Nos</text>
      <text x="534" y="28" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#059669">10 Nos</text>
      <rect x="644" y="16" width="76" height="20" rx="10" fill="#eff6ff"/>
      <text x="660" y="30" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#0066cc">Fulfilled</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(20, 296)">
      <rect x="0" y="0" width="740" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="24" y="36" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">ORDER COMPLETION</text>
      <text x="24" y="66" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#059669">100% Items Ready</text>
      
      <text x="260" y="36" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">WAYBILL TRACKING</text>
      <text x="260" y="66" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">WB-DHL-9920141</text>

      <text x="500" y="36" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#64748b">TOTAL ORDER AMOUNT</text>
      <text x="500" y="66" font-family="Poppins, sans-serif" font-size="18" font-weight="800" fill="#0066cc">$48,750.00</text>
    </g>
  </g>

  <!-- Right: Stock & Logistics Card -->
  <g transform="translate(830, 270)">
    <rect x="0" y="0" width="418" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow2)"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Fulfillment Activity Log</text>
      <text x="0" y="34" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Real-time supply chain audit trail</text>
    </g>

    <g transform="translate(24, 76)">
      <circle cx="8" cy="14" r="5" fill="#059669"/>
      <line x1="8" y1="24" x2="8" y2="70" stroke="#e2e8f0" stroke-width="2"/>
      <text x="24" y="12" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Delivery Note Created</text>
      <text x="24" y="28" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">DN-2025-00094 • 10:45 AM today</text>

      <circle cx="8" cy="80" r="5" fill="#059669"/>
      <line x1="8" y1="90" x2="8" y2="136" stroke="#e2e8f0" stroke-width="2"/>
      <text x="24" y="78" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Warehouse Stock Reserved</text>
      <text x="24" y="94" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Allocated from sellable inventory</text>

      <circle cx="8" cy="146" r="5" fill="#059669"/>
      <line x1="8" y1="156" x2="8" y2="202" stroke="#e2e8f0" stroke-width="2"/>
      <text x="24" y="144" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Advance Payment Recorded</text>
      <text x="24" y="160" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">50% Advance ($24,375) confirmed</text>

      <circle cx="8" cy="212" r="5" fill="#0066cc"/>
      <text x="24" y="210" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">Sales Invoice Ready</text>
      <text x="24" y="226" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">Auto-triggers on customer delivery</text>
    </g>

    <g transform="translate(24, 326)">
      <rect x="0" y="0" width="370" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="16" y="24" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">CARRIER: DHL Express Worldwide</text>
      <text x="16" y="46" font-family="Poppins, sans-serif" font-size="12" fill="#475569">Estimated Arrival: Tomorrow by 2:00 PM</text>
    </g>
  </g>
</svg>
