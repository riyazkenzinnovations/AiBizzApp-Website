<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow2" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad2)"/>

  <!-- Top App Navbar -->
  <rect x="0" y="0" width="1280" height="60" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(24, 12)">
    <circle cx="18" cy="18" r="18" fill="url(#logoGrad2)"/>
    <text x="18" y="23" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Ai</text>
    <text x="44" y="23" font-family="Poppins, sans-serif" font-size="18" font-weight="700" fill="#0f172a">AiBizzApp</text>
    <text x="142" y="23" font-family="Poppins, sans-serif" font-size="16" font-weight="500" fill="#334155">Selling</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(680, 12)">
    <rect x="0" y="0" width="340" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <line x1="24" y1="22" x2="30" y2="28" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="38" y="23" font-family="Poppins, sans-serif" font-size="12" fill="#94a3b8">Search or type a command (Ctrl + K)</text>
  </g>

  <!-- Top Right Controls -->
  <g transform="translate(1060, 14)">
    <circle cx="40" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M37 12 C37 10 43 10 43 12 L45 18 L35 18 Z" fill="#64748b"/>
    <circle cx="44" cy="9" r="3.5" fill="#ef4444"/>
    <circle cx="80" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="80" cy="16" r="4" stroke="#64748b" stroke-width="2" fill="none"/>
    <circle cx="120" cy="16" r="15" fill="#e2e8f0"/>
    <text x="120" y="21" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">SJ</text>
  </g>

  <!-- Secondary Navigation Sub-bar -->
  <rect x="0" y="60" width="1280" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g transform="translate(32, 86)">
    <text x="0" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Dashboard</text>
    <text x="100" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Quotations</text>
    <text x="200" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#0066cc">Sales Orders</text>
    <line x1="198" y1="14" x2="284" y2="14" stroke="#0066cc" stroke-width="2"/>
    <text x="310" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Invoices</text>
    <text x="390" y="0" font-family="Poppins, sans-serif" font-size="13" font-weight="500" fill="#64748b">Pricing Rules</text>
  </g>

  <!-- Breadcrumbs & Status -->
  <g transform="translate(32, 122)">
    <text x="0" y="16" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Selling &gt; Sales Order &gt; <tspan fill="#0066cc">SO-2025-00481</tspan></text>
    <text x="0" y="44" font-family="Poppins, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Order-to-Cash Fulfillment Tracker</text>
    <rect x="350" y="26" width="130" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="362" y="42" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">• To Deliver &amp; Bill</text>

    <rect x="940" y="20" width="140" height="32" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="952" y="41" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#0066cc">+ Create Delivery</text>
    <rect x="1092" y="20" width="124" height="32" rx="6" fill="#0066cc"/>
    <text x="1106" y="41" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#ffffff">+ Create Invoice</text>
  </g>

  <!-- Stepper Pipeline -->
  <g transform="translate(32, 178)">
    <rect x="0" y="0" width="1216" height="76" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow2)"/>
    
    <!-- Step 1 -->
    <circle cx="80" cy="38" r="16" fill="#059669"/>
    <text x="80" y="43" font-family="Poppins, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="108" y="34" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">1. Sales Order</text>
    <text x="108" y="50" font-family="Poppins, sans-serif" font-size="11" fill="#059669">Confirmed (100%)</text>

    <line x1="220" y1="38" x2="300" y2="38" stroke="#059669" stroke-width="2.5"/>

    <!-- Step 2 -->
    <circle cx="330" cy="38" r="16" fill="#059669"/>
    <text x="330" y="43" font-family="Poppins, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="358" y="34" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0f172a">2. Stock Reserved</text>
    <text x="358" y="50" font-family="Poppins, sans-serif" font-size="11" fill="#059669">WH-East Allocated</text>

    <line x1="490" y1="38" x2="570" y2="38" stroke="#0066cc" stroke-width="2.5"/>

    <!-- Step 3 -->
    <circle cx="600" cy="38" r="16" fill="#0066cc"/>
    <circle cx="600" cy="38" r="6" fill="#ffffff"/>
    <text x="628" y="34" font-family="Poppins, sans-serif" font-size="12" font-weight="700" fill="#0066cc">3. Delivery Note</text>
    <text x="628" y="50" font-family="Poppins, sans-serif" font-size="11" fill="#0284c7">Dispatched (DN-094)</text>

    <line x1="770" y1="38" x2="850" y2="38" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Step 4 -->
    <circle cx="880" cy="38" r="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="880" cy="38" r="5" fill="#94a3b8"/>
    <text x="908" y="34" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#64748b">4. Sales Invoice</text>
    <text x="908" y="50" font-family="Poppins, sans-serif" font-size="11" fill="#94a3b8">Pending Signoff</text>
  </g>

  <!-- Content Split -->
  <g transform="translate(32, 270)">
    <!-- Left: Items Table -->
    <rect x="0" y="0" width="780" height="420" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow2)"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="16" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ordered Items &amp; Warehouse Dispatch Allocation</text>
      <text x="0" y="34" font-family="Poppins, sans-serif" font-size="12" fill="#64748b">Customer: BluePeak Technologies • Target Delivery: 22 Sep 2025</text>
    </g>

    <!-- Header -->
    <rect x="20" y="68" width="740" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="90" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">ITEM</text>
    <text x="330" y="90" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">ORDERED</text>
    <text x="440" y="90" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">RESERVED</text>
    <text x="550" y="90" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">DISPATCHED</text>
    <text x="670" y="90" font-family="Poppins, sans-serif" font-size="11" font-weight="600" fill="#475569">STATUS</text>

