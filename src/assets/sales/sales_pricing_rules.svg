      <text x="16" y="40" font-family="Poppins, sans-serif" font-size="11" fill="#64748b">PR-VOL-003 • Priority 2</text>
      <text x="260" y="28" font-family="Poppins, sans-serif" font-size="13" fill="#0f172a">Enterprise &amp; Key Accounts</text>
      <text x="460" y="28" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#0066cc">200+ Units</text>
      <text x="640" y="28" font-family="Poppins, sans-serif" font-size="13" fill="#475569">Percentage on Net</text>
      <text x="820" y="28" font-family="Poppins, sans-serif" font-size="14" font-weight="700" fill="#059669">15.0% OFF</text>
      <rect x="990" y="16" width="60" height="20" rx="10" fill="#ecfdf5"/>
      <text x="1002" y="30" font-family="Poppins, sans-serif" font-size="10" font-weight="600" fill="#059669">Active</text>
    </g>

    <!-- Row 4 -->
