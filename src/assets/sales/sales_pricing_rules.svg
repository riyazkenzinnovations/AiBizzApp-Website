      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="104%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
