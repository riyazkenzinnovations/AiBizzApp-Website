    <circle cx="44" cy="9" r="3.5" fill="#ef4444"/>
    <circle cx="80" cy="16" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="80" cy="16" r="4" stroke="#64748b" stroke-width="2" fill="none"/>
