      <text x="20" y="30" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#0066cc">AUTOMATIC RULE ENGINE:</text>
      <text x="186" y="30" font-family="Poppins, sans-serif" font-size="12" fill="#475569">When multiple rules match, AiBizzApp applies the highest priority tier while strictly enforcing margin floor thresholds.</text>
